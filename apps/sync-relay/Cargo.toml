[workspace]

[package]
name = "slimlocalize-sync-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["SlimLocalize contributors"]
description = "Optional self-hosted Loro sync relay for SlimLocalize"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
loro-websocket-server = "0.1.0"
rusqlite = "0.43"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"
