[package]
name = "slimlocalize-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["SlimLocalize contributors"]
description = "SlimLocalize Tauri desktop and mobile client"
publish = false

[lib]
name = "slimlocalize_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
slimlocalize-core = { path = "../../../crates/core", version = "0.1.0" }
slimlocalize-storage = { path = "../../../crates/storage", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }


[workspace]
