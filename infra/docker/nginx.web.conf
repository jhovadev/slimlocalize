# All public traffic enters here through Dokploy's TLS reverse proxy.
# Neither the relay nor the Rust API exposes a host port in compose.dokploy.yaml.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    # WASM, WebSocket and same-origin API are required; no inline scripts are needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Match /sync/<workspace> and strip the /sync/ prefix for the Rust relay.
    # Do not access-log bearer credentials or websocket upgrade URLs.
    # WebSocket clients cannot reliably follow redirects during Upgrade.
    location = /sync {
        access_log off;
        proxy_pass http://sync-relay:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /sync/ {
        access_log off;
        proxy_pass http://sync-relay:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The MCP endpoint is the ONLY exposed route to the Rust read-only API.
    # The API authenticates the Bearer header itself; no secrets in query strings.
    location = /mcp {
        proxy_pass http://server:8787/mcp;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Server;
        access_log off;
    }
    location ^~ /api/ { return 404; }
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
